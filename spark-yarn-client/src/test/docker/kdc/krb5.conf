[libdefaults]
    default_realm = TEST.REALM
    dns_lookup_realm = false
    dns_lookup_kdc = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    udp_preference_limit = 1

[realms]
    TEST.REALM = {
        kdc = localhost:88
        admin_server = localhost:749
    }

[domain_realm]
    .localhost = TEST.REALM
    localhost = TEST.REALM
